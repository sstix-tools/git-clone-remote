name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for script in bin/git-clone-remote tests/test-git-clone-remote.sh; do
            bash -n "$script"
          done

      - name: Test branch and tag handling
        run: bash tests/test-git-clone-remote.sh
